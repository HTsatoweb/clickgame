<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" type="image/png" href="icon.png">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>インクリメンタル絶対神 — HOME PORTAL —</title>
<style>
:root {
  --bg-main: #020106;
  --bg-panel: rgba(10, 6, 20, 0.9);
  --border-strong: rgba(0, 255, 204, 0.4);
  
  --color-energy: #00ffcc;
  --color-antimatter: #ff0055;
  --color-timeline: #9d4edd;
  --color-galaxy: #3a86ff;
  --color-kimo: #39ff14;
  
  --text-main: #f4f4f5;
  --text-muted: #6b7280;
}

* {
  box-sizing: border-box;
  font-family: 'Consolas', 'Fira Code', 'Courier New', monospace, system-ui;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}

body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-main);
  color: var(--text-main);
  height: 100vh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* 狂気の背景演出 */
.cyber-bg {
  position: absolute;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1.5s ease;
  background: 
    radial-gradient(circle at 20% 30%, rgba(157, 78, 221, 0.2) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(255, 0, 85, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(57, 255, 20, 0.1) 0%, transparent 70%);
}

body.activated .cyber-bg {
  opacity: 1;
}

.cyber-grid {
  position: absolute;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background-image: 
    linear-gradient(rgba(57, 255, 20, 0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 0, 85, 0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  transform: perspective(400px) rotateX(65deg);
  animation: grid-move 15s linear infinite;
}

@keyframes grid-move {
  0% { transform: perspective(400px) rotateX(65deg) translateY(0) rotateZ(0deg); }
  50% { transform: perspective(400px) rotateX(60deg) translateY(40px) rotateZ(1deg); }
  100% { transform: perspective(400px) rotateX(65deg) translateY(0) rotateZ(0deg); }
}

.particle {
  position: absolute;
  background: var(--color-kimo);
  border-radius: 30%;
  box-shadow: 0 0 15px var(--color-kimo);
  animation: float-particle 6s ease-in-out infinite;
}
.particle:nth-child(1) { width: 4px; height: 8px; top: 20%; left: 15%; animation-duration: 5s; }
.particle:nth-child(2) { width: 6px; height: 3px; top: 70%; left: 80%; animation-duration: 8s; background: var(--color-antimatter); box-shadow: 0 0 15px var(--color-antimatter); }
.particle:nth-child(3) { width: 5px; height: 5px; top: 40%; left: 85%; animation-duration: 6s; background: var(--color-timeline); box-shadow: 0 0 15px var(--color-timeline); }
.particle:nth-child(4) { width: 7px; height: 4px; top: 80%; left: 25%; animation-duration: 10s; }

@keyframes float-particle {
  0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.3; }
  30% { transform: translateY(-50px) translateX(30px) scale(1.5) rotate(45deg); opacity: 0.9; }
  70% { transform: translateY(30px) translateX(-20px) scale(0.8) rotate(-45deg); opacity: 0.5; }
}

/* === ステップ1: 作者ロゴ演出画面 === */
.author-screen {
  position: fixed;
  inset: 0;
  background: #000000;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
}

.author-logo-box {
  text-align: center;
  opacity: 0;
  transform: scale(0.8);
  transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.author-screen.show .author-logo-box {
  opacity: 1;
  transform: scale(1);
}

.author-label {
  font-size: 0.75rem;
  letter-spacing: 6px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.author-name {
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(90deg, var(--color-kimo), var(--color-antimatter), var(--color-timeline));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 20px rgba(57, 255, 20, 0.6));
  animation: author-glitch 3s infinite ease-in-out;
}

@keyframes author-glitch {
  0%, 100% { filter: drop-shadow(0 0 20px rgba(57, 255, 20, 0.6)); }
  50% { filter: drop-shadow(0 0 30px rgba(255, 0, 85, 0.8)) hue-rotate(45deg); }
}

/* === ステップ2: ライブラリ・システム仕様演出画面 === */
.library-screen {
  position: fixed;
  inset: 0;
  background: #000000;
  z-index: 9990;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.library-box {
  width: 85%;
  max-width: 450px;
  border: 1px solid var(--color-timeline);
  background: rgba(5, 2, 12, 0.9);
  padding: 25px;
  border-radius: 8px;
  box-shadow: 0 0 35px rgba(157, 78, 221, 0.3);
  text-align: left;
}

.library-title {
  font-size: 0.8rem;
  color: var(--color-timeline);
  letter-spacing: 3px;
  margin-bottom: 15px;
  text-transform: uppercase;
  border-bottom: 1px dashed rgba(157, 78, 221, 0.4);
  padding-bottom: 8px;
}

.lib-line {
  font-size: 0.7rem;
  color: #a1a1aa;
  margin: 6px 0;
  opacity: 0;
  transform: translateY(5px);
  transition: all 0.2s ease;
}

.lib-line.active {
  opacity: 1;
  transform: translateY(0);
}

.lib-line.highlight {
  color: var(--color-energy);
  text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
}

/* === ステップ3: メインホームパネル（自動でふわっと登場） === */
.home-container {
  width: 90%;
  max-width: 500px;
  background: var(--bg-panel);
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  padding: 40px 30px;
  box-shadow: 0 0 50px rgba(57, 255, 20, 0.1), inset 0 0 30px rgba(255, 0, 85, 0.1);
  text-align: center;
  position: relative;
  backdrop-filter: blur(16px);
  opacity: 0;
  transform: scale(0.85);
  transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}

body.activated .home-container {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
  animation: panel-glitch-idle 8s infinite ease-in-out;
}

@keyframes panel-glitch-idle {
  0%, 95%, 100% { transform: translate(0, 0); box-shadow: 0 0 50px rgba(57, 255, 20, 0.1), inset 0 0 30px rgba(255, 0, 85, 0.1); }
  96% { transform: translate(-3px, 2px); box-shadow: 0 0 40px rgba(255, 0, 85, 0.4), inset 0 0 20px rgba(57, 255, 20, 0.3); }
  98% { transform: translate(3px, -2px); border-color: var(--color-antimatter); }
}

.home-title {
  font-size: 1.4rem;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 8px;
  background: linear-gradient(90deg, #fff, var(--color-kimo), var(--color-timeline), var(--color-antimatter));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 12px rgba(57,255,20,0.4));
}

.home-subtitle {
  font-size: 0.75rem;
  color: var(--text-muted);
  letter-spacing: 6px;
  margin-bottom: 35px;
  text-transform: uppercase;
}

.menu-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.btn-menu {
  width: 100%;
  padding: 18px;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  letter-spacing: 2px;
  text-transform: uppercase;
  text-decoration: none;
  display: inline-block;
  border: none;
  outline: none;
  position: relative;
  overflow: hidden;
}

.btn-start {
  background: linear-gradient(90deg, rgba(57, 255, 20, 0.1), rgba(255, 0, 85, 0.1));
  border: 2px solid var(--color-kimo);
  color: var(--color-kimo);
  box-shadow: 0 0 25px rgba(57, 255, 20, 0.2);
}

.btn-start.hard {
  border-color: var(--color-antimatter);
  color: var(--color-antimatter);
  background: linear-gradient(90deg, rgba(255, 0, 85, 0.1), rgba(157, 78, 221, 0.1));
  box-shadow: 0 0 25px rgba(255, 0, 85, 0.2);
}

.btn-start:hover {
  background: var(--color-kimo);
  color: #000;
  box-shadow: 0 0 50px rgba(57, 255, 20, 0.9), 0 0 100px rgba(255, 0, 85, 0.5);
  transform: translateY(-3px) scale(1.02);
}

.btn-start.hard:hover {
  background: var(--color-antimatter);
  color: #fff;
  box-shadow: 0 0 50px rgba(255, 0, 85, 0.9), 0 0 100px rgba(157, 78, 221, 0.5);
}

.version-tag {
  position: absolute;
  bottom: 12px;
  right: 18px;
  font-size: 0.6rem;
  color: var(--text-muted);
}

/* ワープ演出 */
.warp-overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle, #ffffff 0%, var(--color-kimo) 25%, var(--color-antimatter) 60%, #000000 100%);
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.05) rotate(-45deg);
  transition: opacity 0.7s cubic-bezier(0.9, 0, 0.8, 1), transform 0.7s cubic-bezier(0.7, 0, 0.9, 1);
  mix-blend-mode: hard-light;
}

body.warping .warp-overlay {
  opacity: 1;
  transform: scale(35) rotate(180deg);
  pointer-events: auto;
}

body.warping .home-container {
  transform: scale(1.4) rotate(-8deg) skew(15deg, -10deg);
  opacity: 0;
  filter: blur(20px) hue-rotate(270deg);
}

@keyframes kimo-shake {
  0% { transform: translate(0, 0) rotate(0deg); filter: invert(0); }
  10% { transform: translate(-15px, 12px) rotate(-3deg); filter: invert(0.2) hue-rotate(90deg); }
  30% { transform: translate(15px, -12px) rotate(4deg); filter: invert(0.5) hue-rotate(180deg); }
  50% { transform: translate(-10px, -15px) rotate(-2deg); filter: invert(0.1) hue-rotate(270deg); }
  70% { transform: translate(12px, 10px) rotate(3deg); filter: invert(0.3); }
  90% { transform: translate(-5px, -5px) rotate(-1deg); filter: invert(0.8); }
  100% { transform: translate(0, 0) rotate(0deg); filter: invert(0); }
}

body.warping {
  animation: kimo-shake 0.7s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}
</style>
</head>
<body>

<div class="author-screen" id="authorScreen">
  <div class="author-logo-box">
    <div class="author-label">PRESENTS BY</div>
    <div class="author-name">HTsatoweb</div>
  </div>
</div>

<div class="library-screen" id="libraryScreen">
  <div class="library-box">
    <div class="library-title">SYSTEM SPEC & LIBRARIES</div>
    <div class="lib-line" id="l1">> Core Engine: Vanilla JavaScript (ES6+)</div>
    <div class="lib-line" id="l2">> Audio Subsystem: Web Audio API</div>
    <div class="lib-line" id="l3">> Calculation Module: Decimal.js</div>
    <div class="lib-line" id="l4">> Localization: Google Translate Module</div>
    <div class="lib-line highlight" id="l5">> [READY] ALL MODULES VERIFIED.</div>
  </div>
</div>

<div class="warp-overlay"></div>

<div class="cyber-bg">
  <div class="cyber-grid"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="home-container">
  <div class="home-subtitle">インクリメンタル絶対神</div>
  <div class="home-title">INFINITY MATRIX OMEGA</div>
  
  <div class="menu-list">
    <button class="btn-menu btn-start hard" id="startHardBtn">▶ 難易度：難しい (MZ) 新版</button>
    <button class="btn-menu btn-start" id="startEasyBtn">▶ 難易度：簡単 (KN) 旧版</button>
  </div>

  <div class="version-tag">home v6.0</div>
</div>

<script>
class KimoSoundManager {
  static initContext() {
    if (!this.audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.audioCtx = new AudioContext();
    }
    if (this.audioCtx.state === 'suspended') {
      this.audioCtx.resume();
    }
  }

  // 作者ロゴ登場時のサウンド
  static playAuthorSound() {
    try {
      this.initContext();
      const ctx = this.audioCtx;
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(110, now);
      osc.frequency.exponentialRampToValueAtTime(440, now + 1.2);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 1.5);
    } catch(e) { console.log(e); }
  }

  // 本編起動用ブートサウンド
  static playBootSound(onFinished) {
    try {
      this.initContext();
      const ctx = this.audioCtx;
      const now = ctx.currentTime;

      [55, 57.5, 110, 112].forEach((freq, index) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc.type = index % 2 === 0 ? 'sawtooth' : 'square';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 1.5);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.8, now + 3.0);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(200, now);
        filter.frequency.linearRampToValueAtTime(1200, now + 1.5);
        filter.frequency.linearRampToValueAtTime(300, now + 3.0);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.1, now + 0.8);
        gain.gain.setValueAtTime(0.1, now + 2.2);
        gain.gain.linearRampToValueAtTime(0.001, now + 3.0);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start(now);
        osc.stop(now + 3.0);
      });

      if (typeof onFinished === 'function') {
        setTimeout(onFinished, 2500);
      }
    } catch (e) {
      if (typeof onFinished === 'function') onFinished();
    }
  }

  static startBGM() {
    if (this.bgmPlaying) return;
    this.bgmPlaying = true;

    try {
      const ctx = this.audioCtx;
      const creepyChords = [
        [220, 233.08, 329.63],
        [174.61, 185.00, 261.63],
        [130.81, 138.59, 196.00],
        [164.81, 174.61, 246.94] 
      ];

      let chordIndex = 0;
      let noteIndex = 0;

      const playStep = () => {
        if (!this.bgmPlaying) return;
        const now = ctx.currentTime;
        const currentChord = creepyChords[chordIndex];
        const freq = currentChord[noteIndex];

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = noteIndex === 1 ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(freq * 1.5, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.03, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);

        noteIndex++;
        if (noteIndex >= currentChord.length) {
          noteIndex = 0;
          chordIndex = (chordIndex + 1) % creepyChords.length;
        }

        setTimeout(playStep, 200);
      };

      playStep();
    } catch (e) {}
  }

  static playWarpSound() {
    try {
      this.initContext();
      this.bgmPlaying = false; 
      const ctx = this.audioCtx;
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(80, now);
      osc.frequency.exponentialRampToValueAtTime(2400, now + 0.5);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.65);

      gain.gain.setValueAtTime(0.35, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.7);

      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start(now);
      osc.stop(now + 0.7);
    } catch (e) {}
  }
}

// === 自動オープニングアニメーションのシーケンス制御 ===
window.addEventListener('DOMContentLoaded', () => {
  const authorScreen = document.getElementById('authorScreen');
  const libraryScreen = document.getElementById('libraryScreen');

  // 1. ページ読み込み直後、作者ロゴを表示＋サウンド再生
  setTimeout(() => {
    authorScreen.classList.add('show');
    KimoSoundManager.playAuthorSound();
  }, 300);

  // 2. 1.8秒後に作者ロゴを隠し、ライブラリ仕様画面に切り替え
  setTimeout(() => {
    authorScreen.style.opacity = '0';
    authorScreen.style.pointerEvents = 'none';
    
    libraryScreen.style.opacity = '1';
    libraryScreen.style.pointerEvents = 'auto';

    // ライブラリのテキストを1行ずつ順に浮かばせる
    ['l1', 'l2', 'l3', 'l4', 'l5'].forEach((id, idx) => {
      setTimeout(() => {
        document.getElementById(id).classList.add('active');
      }, idx * 180);
    });
  }, 2200);

  // 3. さらに3.5秒後（合計約5.7秒後）にライブラリ画面を消し、メインメニューへ自動移行
  setTimeout(() => {
    libraryScreen.style.opacity = '0';
    libraryScreen.style.pointerEvents = 'none';

    document.body.classList.add('activated');

    // 本格的なBGMとブート音を起動
    KimoSoundManager.playBootSound(() => {
      KimoSoundManager.startBGM();
    });

    // 不要になったDOM要素を削除してメモリを軽くする
    setTimeout(() => {
      authorScreen.remove();
      libraryScreen.remove();
    }, 1000);

  }, 5000);
});

// 難しいボタン（MZclickgame.htmlへ遷移）
document.getElementById('startHardBtn').addEventListener('click', (e) => {
  e.preventDefault();
  KimoSoundManager.playWarpSound();
  document.body.classList.add('warping');

  setTimeout(() => {
    window.location.href = 'MZclickgame.html';
  }, 700);
});

// 簡単ボタン（KNclickgame.htmlへ遷移）
document.getElementById('startEasyBtn').addEventListener('click', (e) => {
  e.preventDefault();
  KimoSoundManager.playWarpSound();
  document.body.classList.add('warping');

  setTimeout(() => {
    window.location.href = 'KNclickgame.html';
  }, 700);
});
</script>

</body>
</html>
